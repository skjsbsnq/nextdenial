<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 3x3 app-grid launcher tile: rounded cells, subtle alternating tones so the
       glyph reads as a grid of apps instead of a flat dot matrix. -->
  <g>
    <rect x="6"  y="6"  width="14" height="14" rx="4" fill="#5e81f4"/>
    <rect x="25" y="6"  width="14" height="14" rx="4" fill="#8b8f98"/>
    <rect x="44" y="6"  width="14" height="14" rx="4" fill="#8b8f98"/>
    <rect x="6"  y="25" width="14" height="14" rx="4" fill="#8b8f98"/>
    <rect x="25" y="25" width="14" height="14" rx="4" fill="#8b8f98"/>
    <rect x="44" y="25" width="14" height="14" rx="4" fill="#8b8f98"/>
    <rect x="6"  y="44" width="14" height="14" rx="4" fill="#8b8f98"/>
    <rect x="25" y="44" width="14" height="14" rx="4" fill="#8b8f98"/>
    <rect x="44" y="44" width="14" height="14" rx="4" fill="#8b8f98"/>
  </g>
</svg>
