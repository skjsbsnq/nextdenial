name: kos_deskcenter
description: >-
  KOS Desk Center desktop widgets (DeskCenter port from NextKde) as a Denial
  plugin.
publish_to: none
version: 0.0.0
environment:
  sdk: ^3.13.0
  flutter: 3.47.5
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  denial_sdk: '0.0.0'
  denial_flutter_sdk: '0.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

denial_plugin:
  schema: 1
  name: KOS Desk Center
  provides:
    # 两个 ShellSurface：桌面容器（kos_deskcenter.container，desktop 层）+
    # 详情面板宿主（kos_deskcenter.panel，desktopControls 层）。
    - contract: package:denial_flutter_sdk/surfaces.dart#ShellSurface
      count: 2
